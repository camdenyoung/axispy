services:
  axispy:
    build: .
    restart: unless-stopped
    init: true
    env_file: ${AXISPY_ENV_FILE:-.env}
    environment:
      AXIS_LOG_FILE: /var/log/axispy/axispy.log
    # Mount the directory so USB reconnects are visible without restarting.
    volumes:
      - /dev/input:/dev/input:ro
      - ${AXIS_LOG_DIR:-./logs}:/var/log/axispy
    device_cgroup_rules:
      - 'c 13:* r'
    # Root can read root-owned input devices; no privileged mode is required.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
