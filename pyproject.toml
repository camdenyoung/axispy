[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axispy"
version = "0.2.0"
description = "USB joystick to Axis VAPIX PTZ controller"
requires-python = ">=3.11"
dependencies = ["pygame>=2.5,<3", "requests>=2.31,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.scripts]
axispy = "axispy:main"

[tool.setuptools]
py-modules = ["axispy", "axispy_web", "axispy_ui"]
