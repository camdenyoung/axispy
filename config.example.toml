# Copy to config.toml. Discover actual SDL indices with: axispy --inspect
[joystick]
device = 0
pan_axis = 0
tilt_axis = 1
zoom_axis = 2
invert_pan = false
invert_tilt = true
invert_zoom = false
# Observed incidental cross-axis movement reached 0.153 on a T8311.
deadzone = 0.18
max_pan = 70
max_tilt = 70
max_zoom = 50
# Confirmed by T8311 inspection: J1=0, J2=1, J3=2, J4=3.
# Hold L for focus near, R for focus far; releasing stops focus.
camera_buttons = [0, 1, 2, 3]
focus_near_button = 4
focus_far_button = 5
focus_speed = 30
# Optional hold-to-move button; -1 disables it.
deadman_button = -1

[control]
rate_hz = 10
# Connect and read timeouts per HTTP operation, in seconds.
timeout = 0.5
# Focus/autofocus lens operations may take longer than PTZ responses.
focus_timeout = 2.0
# Camera-side motion watchdog; requires camera support. See README.
continuous_timeout = 2

[[cameras]]
name = "J1"
url = "https://192.168.1.101"
username = "operator"
password_env = "AXIS_J1_PASSWORD"
channel = 1

[[cameras]]
name = "J2"
url = "https://192.168.1.102"
username = "operator"
password_env = "AXIS_J2_PASSWORD"
channel = 1

[[cameras]]
name = "J3"
url = "https://192.168.1.103"
username = "operator"
password_env = "AXIS_J3_PASSWORD"
channel = 1

[[cameras]]
name = "J4"
url = "https://192.168.1.104"
username = "operator"
password_env = "AXIS_J4_PASSWORD"
channel = 1
